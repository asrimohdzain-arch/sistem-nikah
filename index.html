<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Rekod Nikah Mukim</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root{--maroon:#550000;--navy:#082b57;--gold:#9a7200;--bg:#f2f6fb;--line:#d9e2ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Segoe UI',sans-serif;color:#17212b;font-size:14px}
.app{min-height:100vh;overflow-x:hidden}
.header{height:86px;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 250px;box-shadow:0 2px 8px #0003}
.brand{font-size:20px;font-weight:700}
.header-right{display:flex;align-items:center;gap:14px}
.date-pill{background:#ffffff22;border:1px solid #ffffff55;padding:10px 14px;border-radius:18px;font-weight:600}
.bell{position:relative;border:0;background:#ffffff22;color:#fff;width:42px;height:42px;border-radius:50%;font-size:21px;cursor:pointer}
.badge{position:absolute;right:-3px;top:-4px;background:#d60000;color:#fff;min-width:19px;height:19px;border-radius:10px;font-size:11px;display:none;align-items:center;justify-content:center}
.sidebar{position:fixed;left:0;top:0;width:225px;height:100vh;background:#fff;border-right:1px solid var(--line);padding:18px 10px;z-index:2}
.logo{background:var(--maroon);color:#fff;text-align:center;border-radius:14px;padding:18px 8px;margin-bottom:18px;font-size:18px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:9px}
.nav button,.btn{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:11px 14px;font-family:inherit;font-weight:650;cursor:pointer;transition:.2s}
.nav button{text-align:left;width:100%}
.nav button.active,.btn.active{background:var(--gold)}
main{margin-left:225px;padding:20px}
.page{display:none}
.page.active{display:block}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 7px 20px #17324d12;margin-bottom:16px}
.page-title{margin:0 0 15px;color:var(--maroon)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid #cbd8e5;border-radius:12px;padding:17px}
.card b{display:block;color:#53657a;margin-bottom:8px}
.value{font-size:28px;font-weight:800;color:var(--navy)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.smart-search{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px;background:#f6f9fc;border:1px solid var(--line);border-radius:10px}
.smart-search input{flex:1;min-width:180px;padding:9px 12px}
.search-count{color:#53657a;font-size:12px;white-space:nowrap}
.clear-search{border:0;background:#dfe8f2;color:#082b57;border-radius:7px;padding:9px 11px;font-family:inherit;font-weight:700;cursor:pointer}
.form-shell{max-width:760px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field.full{grid-column:1/-1}
label{display:block;font-weight:650;margin:0 0 6px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #bcc9d6;border-radius:7px;font:14px 'Segoe UI',sans-serif;background:#fff}
.hidden{display:none!important}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:10px}
th,td{padding:5px 6px;border:1px solid #bdc8d3;text-align:left}
th{background:var(--navy);color:#fff;text-align:center}
.settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.setting-card{position:relative;display:flex;flex-direction:column;padding:20px;border:1px solid #cbd8e5;border-radius:14px;background:#fff}
.bars{display:flex;align-items:flex-end;gap:7px;height:190px;border-bottom:1px solid #aaa;padding:8px}
.bar{flex:1;background:#587ba4;min-height:2px;position:relative}
.btn-wa{background:#25D366;color:#fff;border:0;padding:4px 8px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:11px}
@media(max-width:640px){
.sidebar{top:auto;bottom:0;width:100%;height:64px;display:flex;position:fixed;z-index:20;background:#fff}
.logo{display:none}
.nav{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nav button{font-size:11px!important;text-align:center!important;padding:7px 3px}
.header{height:68px;padding:8px 10px;position:sticky;top:0;z-index:15}
main{margin-left:0;padding:10px 10px 80px}
.cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="logo">SISTEM NIKAH</div>
    <nav class="nav">
      <button class="active" data-page="utama" type="button">🏠 Utama</button>
      <button data-page="rekod" type="button">📋 Rekod Nikah</button>
      <button data-page="tetapan" type="button">⚙️ Tetapan</button>
    </nav>
  </aside>
  <header class="header">
    <div class="brand">SISTEM REKOD NIKAH MUKIM</div>
    <div class="header-right">
      <button class="bell" id="bell" type="button">🔔<span class="badge" id="badge">0</span></button>
      <div class="date-pill" id="today"></div>
    </div>
  </header>
  <main>
    <section id="utama" class="page active">
      <div class="panel">
        <h2 class="page-title">Analisa Rekod Nikah</h2>
        <div class="cards">
          <div class="card"><b>Jumlah Rekod Nikah</b><span class="value" id="total">0</span></div>
          <div class="card"><b>Rekod Bulan Ini</b><span class="value" id="monthTotal">0</span></div>
          <div class="card"><b>Jumlah Kampung</b><span class="value" id="villageTotal">0</span></div>
        </div>
      </div>
      <div class="chart-row">
        <div class="panel"><h3>Rekod Mengikut Bulan</h3><div class="bars" id="monthBars"></div></div>
        <div class="panel"><h3>Jumlah Mengikut Kampung</h3><div id="villageList"></div></div>
      </div>
    </section>
    
    <section id="rekod" class="page">
      <div class="panel">
        <h2 class="page-title">Rekod Nikah</h2>
        <div class="toolbar">
          <button class="btn" id="showForm" type="button">Tambah Rekod Nikah</button>
          <button class="btn" id="showList" type="button">Senarai Rekod</button>
          <button class="btn" id="printBtn" type="button">Cetak Rekod</button>
          <button class="btn" id="pdfBtn" type="button">Muat Turun PDF</button>
          <select id="yearSelect" style="width:auto"></select>
        </div>
        <div id="searchPanel" class="smart-search">
          <input id="smartSearch" type="search" placeholder="Cari nama, tarikh, kampung...">
          <button id="clearSearch" class="clear-search" type="button">Kosongkan</button>
          <span id="searchCount" class="search-count">0 rekod</span>
        </div>
        <div id="formPanel" class="form-shell hidden">
          <form id="nikahForm">
            <div class="grid">
              <div class="field"><label>Tarikh Nikah</label><input type="date" name="tarikh" required></div>
              <div class="field"><label>Hari</label><input name="hari" readonly required placeholder="Automatik"></div>
              <div class="field"><label>Masa Nikah</label><input type="time" name="masa" required></div>
              <div class="field"><label>Nama Pengantin</label><input name="nama" required></div>
              <div class="field">
                <label>Kampung</label>
                <select name="kampung" id="kampung" required>
                  <option value="">-- Sila Pilih --</option>
                  <option>Surau</option>
                  <option>B12</option>
                  <option>Pondok</option>
                  <option>Banggol Kuin</option>
                  <option>Mengkirim</option>
                  <option>Alor Lenggak</option>
                  <option>Gebeng</option>
                  <option>Lubok Kawah Dalam</option>
                  <option>Pak Jak</option>
                  <option>Lumpur</option>
                  <option>Machang Bubuk</option>
                  <option value="Lain-lain">Lain-lain</option>
                </select>
              </div>
              <div class="field hidden" id="kLain"><label>Nama Kampung</label><input name="kampung_lain"></div>
              <div class="field">
                <label>Tempat Nikah</label>
                <select name="tempat" id="tempat" required>
                  <option value="">-- Sila Pilih --</option>
                  <option>Masjid Mukim</option>
                  <option>Masjid Pondok</option>
                  <option>Rumah</option>
                  <option>Dewan</option>
                  <option value="Lain-lain">Lain-lain</option>
                </select>
              </div>
              <div class="field hidden" id="tLain"><label>Lokasi Nikah</label><input name="tempat_lain"></div>
              <div class="field"><label>No. Telefon</label><input type="tel" name="tel" required></div>
              <div class="field">
                <label>Jenis Wali</label>
                <select name="wali" required>
                  <option value="">-- Sila Pilih --</option>
                  <option>Bapa</option>
                  <option>Datuk</option>
                  <option>Wali Sultan</option>
                </select>
              </div>
              <div class="field full"><label>Catatan</label><textarea name="catatan" rows="3"></textarea></div>
            </div>
            <button class="btn" type="submit" id="saveBtn" style="margin-top:14px">Simpan Rekod</button>
          </form>
        </div>
        <div id="listPanel" class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Bil.</th><th>Tarikh</th><th>Hari</th><th>Masa</th><th>Nama</th><th>Kampung</th><th>Tempat</th><th>Telefon</th><th>Wali</th><th>Catatan</th><th>Whatsapp</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
    
    <section id="tetapan" class="page">
      <div class="panel">
        <h2 class="page-title">Tetapan</h2>
        <div class="settings-grid">
          <div class="setting-card"><b>Hapus Semua</b><button class="btn" id="deleteAll" style="background:#8b0000;margin-top:10px" type="button">Hapus</button></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyBflySl7ok21LE4urn0rKrSVxczRrZykQE", authDomain: "sistem-rekod-nikah.firebaseapp.com", projectId: "sistem-rekod-nikah", storageBucket: "sistem-rekod-nikah.firebasestorage.app", messagingSenderId: "473243104741", appId: "1:473243104741:web:be6dcfbe86256753beeb0c" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let records = [];

document.addEventListener("DOMContentLoaded", () => {
  const $= s => document.querySelector(s),$$ = s => [...document.querySelectorAll(s)];
  const days = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];

  $('#today').textContent = 'Tarikh: ' + new Intl.DateTimeFormat('ms-MY',{day:'2-digit',month:'long',year:'numeric'}).format(new Date());    $$('.nav button').forEach(b => {
    b.onclick = () => {
      $$('.page').forEach(p => p.classList.toggle('active', p.id === b.dataset.page));$$
('.nav button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if(b.dataset.page === 'rekod') renderRows();
    };
  });

  const tarikhInput = document.querySelector('#nikahForm input[name="tarikh"]');
  if(tarikhInput){
    tarikhInput.onchange = e => {
      const val = e.target.value;
      if(val){
        const d = new Date(val + 'T00:00:00');
        document.querySelector('#nikahForm input[name="hari"]').value = days[d.getDay()];
      }
    };
  }

  $('#showForm').onclick = () => { $('#formPanel').classList.remove('hidden'); $('#listPanel').classList.add('hidden'); $('#searchPanel').classList.add('hidden'); };
  $('#showList').onclick = () => { $('#formPanel').classList.add('hidden'); $('#listPanel').classList.remove('hidden'); $('#searchPanel').classList.remove('hidden'); renderRows(); };

  async function load(){
    try {
      const s = await db.collection('rekod_nikah').get();
      records = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.tarikh || '').localeCompare(b.tarikh || ''));
      $('#total').textContent = records.length;
      renderRows();
    }catch(err){
      console.error("Ralat pangkalan data:", err);
    }
  }

  function renderRows(){
    const q = ($('#smartSearch')?.value || '').toLowerCase();
    const filtered = !q ? records : records.filter(r => (r.nama || '').toLowerCase().includes(q));
    $('#rows').innerHTML = filtered.map((r,i) => `<tr><td>${i+1}</td><td>${r.tarikh||''}</td><td>${r.hari||''}</td><td>${r.masa||''}</td><td>${r.nama||''}</td><td>${r.kampung||''}</td><td>${r.tempat||''}</td><td>${r.tel||''}</td><td>${r.wali||''}</td><td>${r.catatan||''}</td><td><button class="btn-wa" onclick="alert('${r.nama}')">WhatsApp</button></td></tr>`).join('') || '<tr><td colspan="11" style="text-align:center">Tiada rekod</td></tr>';
    $('#searchCount').textContent = `${filtered.length} daripada ${records.length} rekod`;
  }

  $('#smartSearch').oninput = renderRows;
  load();
});
</script>
</body>
</html>
